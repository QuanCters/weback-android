name: Verification Harness CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Candidate Verification Lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Provision Android SDK Platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper Integrity
        run: |
          python3 verification/checks/gradle_wrapper_check.py

      - name: Pre-warm Gradle Dependencies
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Install verification test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml==6.0.2

      - name: Compute CI Verification Context
        id: context
        env:
          TRANSITION_AUTHORIZATION: ${{ vars.TRANSITION_AUTHORIZATION }}
          APPROVED_POLICY_SHA256: ${{ vars.APPROVED_POLICY_SHA256 }}
        run: |
          # Context resolution for pull_request and push events
          # Derives candidate_sha, base_sha, base_ref, run_id, report_path, policy_file
          python3 verification/checks/transition.py resolve-context \
            --event-name "${{ github.event_name }}" \
            --pr-head "${{ github.event.pull_request.head.sha }}" \
            --pr-base "${{ github.event.pull_request.base.sha }}" \
            --pr-base-ref "${{ github.event.pull_request.base.ref }}" \
            --push-sha "${{ github.sha }}" \
            --push-before "${{ github.event.before }}" \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output-github-env "$GITHUB_OUTPUT"

      - name: Run Candidate Verification Lane
        env:
          TRANSITION_AUTHORIZATION: ${{ vars.TRANSITION_AUTHORIZATION }}
          APPROVED_POLICY_SHA256: ${{ vars.APPROVED_POLICY_SHA256 }}
        run: |
          python3 verification/run.py \
            --lane candidate \
            --config "${{ steps.context.outputs.policy_file }}" \
            --base-ref "${{ steps.context.outputs.base_sha }}" \
            --run-id "${{ steps.context.outputs.run_id }}"

      - name: Run Diagnostic Proposed Checks
        if: steps.context.outputs.is_transition == 'false'
        run: |
          python3 verification/run.py \
            --lane fast \
            --config policies/checks.json \
            --run-id "${{ steps.context.outputs.run_id }}-diagnostic"

      - name: Authoritative Evidence Audit (Approved Policy Enforcement)
        env:
          TRANSITION_AUTHORIZATION: ${{ vars.TRANSITION_AUTHORIZATION }}
        run: |
          REPORT_PATH="${{ steps.context.outputs.report_path }}"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Error: Expected authoritative evidence report not found at $REPORT_PATH" >&2
            exit 1
          fi
          echo "Auditing candidate evidence report: $REPORT_PATH"
          python3 verification/checks/evidence.py \
            --report "$REPORT_PATH" \
            --require-candidate \
            --expected-run-id "${{ steps.context.outputs.run_id }}" \
            --expected-sha "${{ steps.context.outputs.candidate_sha }}" \
            --expected-base-sha "${{ steps.context.outputs.base_sha }}" \
            --expected-policy-sha256 "${{ vars.APPROVED_POLICY_SHA256 }}" \
            --expected-required-checks ${{ steps.context.outputs.expected_required_checks }} \
            --policy "${{ steps.context.outputs.policy_file }}" \
            --event-name "${{ github.event_name }}" \
            --expected-tree-sha "${{ steps.context.outputs.tree_sha }}" \
            --parent-shas ${{ steps.context.outputs.parent_shas }}

      - name: Audit Diagnostic Android Evidence Report
        if: steps.context.outputs.is_transition == 'false'
        run: |
          DIAG_REPORT="artifacts/verification/${{ steps.context.outputs.run_id }}-diagnostic/report.json"
          if [ ! -f "$DIAG_REPORT" ]; then
            echo "Error: Expected diagnostic evidence report not found at $DIAG_REPORT" >&2
            exit 1
          fi
          echo "Auditing diagnostic FCT-001 evidence report: $DIAG_REPORT"
          python3 verification/checks/evidence.py \
            --report "$DIAG_REPORT" \
            --policy policies/checks.json

      - name: Upload Verification Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/verification/
          if-no-files-found: ignore
