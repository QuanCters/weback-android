name: Verification Harness CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Candidate Verification Lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Provision Android SDK Platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle Wrapper Integrity
        run: |
          python3 verification/checks/gradle_wrapper_check.py

      - name: Pre-warm Gradle Dependencies
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: Install verification test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml==6.0.2

      - name: Compute CI Verification Context
        id: context
        run: |
          RUN_ID="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          REPORT_PATH="artifacts/verification/$RUN_ID/report.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CANDIDATE_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            CANDIDATE_SHA="${{ github.sha }}"
            BASE_SHA="${{ github.event.before }}"
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "$CANDIDATE_SHA")
              BASE_REF="$BASE_SHA"
            fi
          else
            echo "Error: Unsupported CI event '${{ github.event_name }}'" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Run Candidate Verification Lane
        run: |
          python3 verification/run.py \
            --lane candidate \
            --base-ref "${{ steps.context.outputs.base_sha }}" \
            --run-id "${{ steps.context.outputs.run_id }}"

      - name: Run Diagnostic Proposed Checks
        run: |
          python3 verification/run.py \
            --lane fast \
            --config policies/fct001_checks_canonical.json \
            --run-id "${{ steps.context.outputs.run_id }}-diagnostic"

      - name: Authoritative Evidence Audit (Approved Policy Enforcement)
        run: |
          REPORT_PATH="${{ steps.context.outputs.report_path }}"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Error: Expected evidence report not found at $REPORT_PATH" >&2
            exit 1
          fi
          echo "Auditing candidate evidence report: $REPORT_PATH"
          python3 verification/checks/evidence.py \
            --report "$REPORT_PATH" \
            --require-candidate \
            --expected-run-id "${{ steps.context.outputs.run_id }}" \
            --expected-sha "${{ steps.context.outputs.candidate_sha }}" \
            --expected-base-sha "${{ steps.context.outputs.base_sha }}" \
            --expected-policy-sha256 "${{ vars.APPROVED_POLICY_SHA256 }}" \
            --expected-required-checks spec-hygiene harness-selftests \
            --policy policies/checks.json \
            ${{ vars.TRANSITION_AUTHORIZATION && format('--transition-auth "{0}"', vars.TRANSITION_AUTHORIZATION) || '' }}

      - name: Audit Diagnostic Android Evidence Report
        run: |
          DIAG_REPORT="artifacts/verification/${{ steps.context.outputs.run_id }}-diagnostic/report.json"
          if [ -f "$DIAG_REPORT" ]; then
            echo "Auditing diagnostic FCT-001 evidence report: $DIAG_REPORT"
            python3 verification/checks/evidence.py \
              --report "$DIAG_REPORT" \
              --policy policies/fct001_checks_canonical.json
          fi

      - name: Upload Verification Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/verification/
          if-no-files-found: ignore
