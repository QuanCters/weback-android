name: Verification Harness CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Candidate Verification Lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml==6.0.2

      - name: Run Candidate Verification Lane
        run: |
          python3 verification/run.py --lane candidate --base-ref "${{ github.event.pull_request.base.ref || 'main' }}"

      - name: Authoritative Evidence Audit (Provisional Candidate Verification)
        run: |
          REPORT_PATH=$(ls -t artifacts/verification/*/report.json | head -n 1)
          if [ -z "$REPORT_PATH" ] || [ ! -f "$REPORT_PATH" ]; then
            echo "Error: No evidence report generated by verification run" >&2
            exit 1
          fi
          echo "Auditing candidate evidence report: $REPORT_PATH"
          python3 verification/checks/evidence.py \
            --report "$REPORT_PATH" \
            --require-candidate \
            --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --expected-base-sha "${{ github.event.pull_request.base.sha || '4c7e78ca6c4a73290493fa543aaaa48336a181c3' }}" \
            --expected-policy-sha256 "${{ vars.APPROVED_POLICY_SHA256 || '4a004ac8d07178c4164193d827983dfa5a7d86c5245fbcb6df69497e976137fd' }}" \
            --expected-required-checks spec-hygiene harness-selftests \
            --policy policies/checks.json

      - name: Upload Verification Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/verification/
          if-no-files-found: ignore
